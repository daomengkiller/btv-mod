plugins { id 'com.android.application' }
android {
    namespace 'com.littlesauce.ramball'
    compileSdk 34
    defaultConfig {
        applicationId "com.littlesauce.ramball"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // intentionally empty: plain android.app.Activity, no appcompat
}